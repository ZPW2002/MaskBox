[project]
name = "maskbox"
description = "MaskBox - Not just hide, but disguise. A Windows folder hide & disguise toolbox."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "MIT" }
authors = [{ name = "ZPW2002" }]
keywords = ["windows", "folder", "mask", "hide", "pywebview", "vue"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
maskbox = "shell.main:main"

[tool.setuptools]
packages = ["backend", "backend.core", "backend.storage", "backend.api", "shell"]

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # subprocess is intentional for Windows attrib; paths are argv-only

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:flask_sqlalchemy"]
