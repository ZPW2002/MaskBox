name: Feature Request / 功能建议
description: 为 MaskBox 提出新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    attributes:
      label: 确认
      options:
        - label: 该功能不涉及密码、加密或应用锁（D3 已排除）
          required: true
        - label: 该功能只在 Windows 上运行（D4）
          required: true
