name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    name: Test backend (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check backend shell tests
          black --check backend shell tests
      - name: Run tests
        run: pytest

  build-windows:
    name: Test and build Windows portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run tests
        run: pytest
      - name: Package portable zip
        shell: pwsh
        run: ./scripts/build.ps1 -Version "$(git describe --tags --always)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maskbox-windows-portable
          path: dist/MaskBox-v*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maskbox-windows-portable
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/MaskBox-v*.zip
          generate_release_notes: true
